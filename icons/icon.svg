    <circle cx="256" cy="248" r="92" fill="#fffdf8"/>
    <ellipse cx="220" cy="232" rx="27" ry="33" fill="#2a2017" transform="rotate(-16 220 232)"/>
    <ellipse cx="292" cy="232" rx="27" ry="33" fill="#2a2017" transform="rotate(16 292 232)"/>
    <circle cx="224" cy="236" r="10" fill="#ffffff"/>
    <circle cx="288" cy="236" r="10" fill="#ffffff"/>
    <ellipse cx="256" cy="283" rx="17" ry="12" fill="#2a2017"/>
    <path d="M238 300 q18 18 36 0" fill="none" stroke="#2a2017" stroke-width="7" stroke-linecap="round"/>
    <circle cx="183" cy="272" r="16" fill="#ef7d5a" opacity="0.35"/>
