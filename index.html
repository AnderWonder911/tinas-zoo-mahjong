<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tina's Zoo Mahjong</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="A cosy animal mahjong solitaire you can play on your phone.">
<meta name="theme-color" content="#0d3b2e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zoo Mahjong">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./app.css">
<!-- iOS launch screens (standalone mode) -->
<link rel="apple-touch-startup-image" href="./splash/splash-1320x2868.png" media="(device-width:440px) and (device-height:956px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="./splash/splash-1290x2796.png" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="./splash/splash-1284x2778.png" media="(device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="./splash/splash-1242x2688.png" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="./splash/splash-1242x2208.png" media="(device-width:414px) and (device-height:736px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="./splash/splash-1206x2622.png" media="(device-width:402px) and (device-height:874px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="./splash/splash-1179x2556.png" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="./splash/splash-1170x2532.png" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="./splash/splash-1125x2436.png" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="./splash/splash-828x1792.png" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:2) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="./splash/splash-750x1334.png" media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2) and (orientation:portrait)">
</head>
<body>
<div id="app">

  <!-- ===== Home ===== -->
  <section class="screen screen--home is-active" id="screen-home">
    <div class="home-scroll">
      <header class="home-head">
        <div class="home-mark" aria-hidden="true">
          <span>🐼</span><span>🦊</span><span>🐸</span>
        </div>
        <h1 class="home-title">Tina's<br><em>Zoo Mahjong</em></h1>
        <p class="home-sub">Match two free animals. Clear the board. Free the zoo.</p>
      </header>

      <button class="btn btn--primary btn--continue" id="btn-continue" hidden>
        <span class="btn-label">Continue</span>
        <span class="btn-meta" id="continue-meta"></span>
      </button>

      <h2 class="section-title">Choose a board</h2>
      <div class="levels" id="levels"></div>

      <div class="home-foot">
        <button class="linklike" id="btn-how">How to play</button>
        <span class="dot">·</span>
        <button class="linklike" id="btn-install">Add to Home Screen</button>
      </div>
    </div>
  </section>

  <!-- ===== Game ===== -->
  <section class="screen screen--game" id="screen-game">
    <header class="topbar">
      <button class="icon-btn" id="btn-back" aria-label="Back to menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="stats">
        <div class="stat"><span class="stat-val" id="stat-time">0:00</span><span class="stat-key">time</span></div>
        <div class="stat"><span class="stat-val" id="stat-left">0</span><span class="stat-key">tiles</span></div>
        <div class="stat"><span class="stat-val" id="stat-moves">0</span><span class="stat-key">moves</span></div>
      </div>
      <button class="icon-btn" id="btn-pause" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
      </button>
    </header>

    <div class="board-wrap" id="board-wrap">
      <div class="board" id="board"></div>
      <p class="rotate-hint">↻ Turn your phone upright for bigger tiles</p>
    </div>

    <footer class="toolbar">
      <button class="tool" id="btn-undo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H5V3M5.5 7a8 8 0 1 1-1.2 6"/></svg>
        <span>Undo</span>
      </button>
      <button class="tool" id="btn-hint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5.9 1.2.9 1.9v.2h5.2v-.2c0-.7.3-1.4.9-1.9A6 6 0 0 0 12 3z"/></svg>
        <span>Hint</span>
      </button>
      <button class="tool" id="btn-shuffle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h4l10 10h4M17 3l4 4-4 4M3 17h4l3-3M17 21l4-4-4-4"/></svg>
        <span>Shuffle</span>
      </button>
      <button class="tool" id="btn-sound">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-on"><path d="M5 9v6h4l5 4V5L9 9H5zM17 9.5a4 4 0 0 1 0 5"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-off"><path d="M5 9v6h4l5 4V5L9 9H5zM17 10l4 4M21 10l-4 4"/></svg>
        <span id="sound-label">Sound</span>
      </button>
    </footer>
  </section>

  <!-- ===== Overlay ===== -->
  <div class="overlay" id="overlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <!-- ===== Love screen (shown when a board is cleared) ===== -->
  <div class="love" id="love" hidden>
    <div class="love-glow" aria-hidden="true"></div>
    <div class="love-body">
      <div class="love-heart" aria-hidden="true">❤️‍🔥</div>
      <p class="love-message" id="love-message"></p>
    </div>
    <div class="love-foot">
      <p class="love-stats" id="love-stats"></p>
      <div class="love-actions">
        <button class="btn btn--love" id="love-again">Play again</button>
        <button class="btn btn--quiet" id="love-menu">Choose board</button>
      </div>
    </div>
  </div>

  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="./js/love.js"></script>
<script src="./app.js"></script>
</body>
</html>
